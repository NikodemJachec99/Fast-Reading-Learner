<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Info Hunter</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#106350}a:hover{color:#0F5E4D}
button{font-family:inherit}
@keyframes oc-a{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes oc-b{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes oc-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@keyframes ih-found{0%{background:rgba(201,233,215,0);box-shadow:0 0 0 0 rgba(201,233,215,0)}60%{background:#C9E9D7;box-shadow:0 0 0 6px #C9E9D7}100%{background:#C9E9D7;box-shadow:0 0 0 3px #C9E9D7}}
@keyframes ih-wrong{0%{background:#F4C9BD}100%{background:rgba(252,236,230,0)}}
@keyframes ih-dot{0%{transform:scale(.4)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes ih-tick{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes ih-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FBFAF6; color: #163B34; font-family: Manrope, system-ui, sans-serif">
  <div style="position: absolute; left: 16px; right: 16px; top: 52px; display: flex; justify-content: space-between; align-items: center">
    <a href="Intro04Hunter.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 99px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 1px solid #DCE3DD"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#163B34" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <div style="text-align: center"><div style="font-size: 11px; font-weight: 800; letter-spacing: .14em; color: #974E3D">TRAINING · STEP 1 OF 3</div><div style="font-size: 17px; font-weight: 800">Info Hunter</div></div>
    <span style="min-width: 44px"></span>
  </div>

  <div style="position: absolute; left: 22px; right: 22px; top: 112px; display: flex; gap: 6px; align-items: center">
    <span style="font-size: 12px; font-weight: 700; color: #55695F; margin-right: 4px">Preview level</span>
    <sc-for list="{{levels}}" as="l" hint-placeholder-count="3"><button type="button" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}" style="{{l.style}}">{{l.label}}</button></sc-for>
  </div>

  <div style="{{cardStyle}}">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="display: flex; gap: 6px; align-items: center">
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="3"><span style="{{d}}"></span></sc-for>
      </span>
      <span style="display: flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; color: #CFE6DB"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8ACFB2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="{{tickStyle}}"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{time}}</span>
    </div>
    <div style="font-size: 11px; font-weight: 800; letter-spacing: .12em; color: #BFE3D2; margin-top: 10px">{{goalLabel}}</div>
    <div style="font-size: 19px; font-weight: 800; letter-spacing: -.02em; margin-top: 3px">{{goal}}</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 268px; bottom: 140px; overflow-y: auto; padding: 4px 26px 20px; box-sizing: border-box">
    <p style="margin: 0; font-family: Literata, Georgia, serif; font-size: 18px; line-height: 1.85; color: #163B34"><sc-for list="{{tokens}}" as="t" hint-placeholder-count="40"><span><button type="button" onClick="{{t.tap}}" style="{{t.style}}">{{t.w}}</button>{{t.sp}}</span></sc-for></p>
  </div>

  <sc-if value="{{hunting}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 22px; right: 22px; bottom: 34px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: #55695F"><span>Tap the exact words in the text</span><span style="{{missStyle}}">{{misses}} wrong</span></div>
      <div style="min-height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 18px; background: #E6ECE4; color: #8A9A92; font-size: 16px; font-weight: 800">Task {{taskNo}} of 3</div>
    </div>
  </sc-if>
  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 22px; right: 22px; bottom: 34px; display: flex; flex-direction: column; gap: 10px; animation: ih-in .4s both">
      <div style="border-radius: 18px; padding: 12px 14px; background: #DCF0E5; font-size: 14px; font-weight: 700; color: #106350">3 facts found in {{time}} · {{misses}} wrong taps</div>
      <a href="Test.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 18px; background: #16846C; color: #FFFFFF; font-size: 17px; font-weight: 800; text-decoration: none; box-shadow: 0 10px 22px rgba(22,132,108,.28)">Continue to the test</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { level: 1, task: 0, found: [], wrong: null, misses: 0, secs: 0, shake: 0 };
    this.n = 0;
  }
  componentDidMount() {
    this.clock = setInterval(() => { if (this.state.task < 3) this.setState({ secs: this.state.secs + 1 }); }, 1000);
  }
  componentWillUnmount() { clearInterval(this.clock); clearTimeout(this.nt); }
  text(level) {
    const a = 'In 1998 the town of Brena opened its first library in an old grain warehouse. The shelves hold 12,000 books, and the reading room faces the river. The building was designed by Maria Lenk, a local architect.';
    const b = ' Before that, families travelled forty minutes by bus to borrow a single book. In the first year loans nearly doubled, and the librarian Ewa Marek started an evening club that still meets every second Thursday. The library opens at 9 every morning and closes at 7 on weekdays.';
    const c = 'Plans for a library were first drawn up in 1989, but the money ran out. In 1998 the town of Brena finally opened its first library in an old grain warehouse. On the first weekend about 2,000 visitors came. The shelves hold 12,000 books, and 1,200 more are on order. The furniture was built by Maria Kurz and her students, while the building was designed by Maria Lenk, a local architect. The library opens at 9 every morning.';
    return level === 1 ? a : level === 2 ? a + b : c;
  }
  renderVals() {
    const s = this.state;
    const goals = [
      { label: 'FIND THE YEAR', goal: 'When did the library open?', ans: ['1998'] },
      { label: 'FIND THE NUMBER', goal: 'How many books do the shelves hold?', ans: ['12,000'] },
      { label: 'FIND THE NAME', goal: 'Who designed the building?', ans: ['Maria', 'Lenk'] },
    ];
    const words = this.text(s.level).split(' ');
    const norm = (w) => w.replace(/^[^\w]+|[^\w]+$/g, '');
    const rangeOf = (ans) => {
      for (let i = 0; i <= words.length - ans.length; i++) {
        let ok = true;
        for (let j = 0; j < ans.length; j++) if (norm(words[i + j]) !== ans[j]) { ok = false; break; }
        if (ok) return [i, i + ans.length - 1];
      }
      return [-1, -1];
    };
    const ranges = goals.map((g) => rangeOf(g.ans));
    const inFound = (i) => s.found.some((t) => i >= ranges[t][0] && i <= ranges[t][1]);
    const justFound = (i) => s.found.length && (() => { const t = s.found[s.found.length - 1]; return i >= ranges[t][0] && i <= ranges[t][1]; })();
    const done = s.task >= 3;
    const g = goals[Math.min(s.task, 2)];
    const base = 'display: inline; padding: 0 1px; margin: 0; border: 0; background: transparent; font: inherit; color: inherit; line-height: inherit; cursor: pointer; border-radius: 5px; ';
    return {
      levels: [1, 2, 3].map((n) => ({
        label: 'L' + n, pressed: s.level === n ? 'true' : 'false',
        pick: () => { clearTimeout(this.nt); this.setState({ level: n, task: 0, found: [], wrong: null, misses: 0, secs: 0 }); },
        style: 'min-width: 44px; min-height: 32px; border-radius: 99px; font-size: 12px; font-weight: 800; cursor: pointer; ' + (s.level === n ? 'background: #163B34; color: #FFFFFF; border: 1px solid #163B34;' : 'background: #FFFFFF; color: #163B34; border: 1px solid #DCE3DD;'),
      })),
      cardStyle: 'position: absolute; left: 22px; right: 22px; top: 156px; box-sizing: border-box; padding: 14px 16px; border-radius: 22px; background: #163B34; color: #FFFFFF; box-shadow: 0 12px 26px rgba(22,59,52,.22); animation: ' + (s.shake ? 'oc-shake .35s' + (s.task % 2 ? ', oc-a .4s' : ', oc-b .4s') : (s.task % 2 ? 'oc-a' : 'oc-b') + ' .4s cubic-bezier(.2,.8,.2,1)') + ';',
      dots: [0, 1, 2].map((i) => 'width: ' + (i === s.task ? '22px' : '8px') + '; height: 8px; border-radius: 99px; transition: width .3s cubic-bezier(.34,1.56,.64,1), background .3s; background: ' + (s.found.indexOf(i) >= 0 ? '#4FB893' : i === s.task ? '#FFFFFF' : 'rgba(255,255,255,.25)') + ';' + (s.found.indexOf(i) >= 0 ? ' animation: ih-dot .4s cubic-bezier(.34,1.56,.64,1);' : '')),
      tickStyle: done ? '' : 'animation: ih-tick 1s steps(2) infinite;',
      time: Math.floor(s.secs / 60) + ':' + String(s.secs % 60).padStart(2, '0'),
      goalLabel: done ? 'ALL TASKS DONE' : 'TASK ' + (s.task + 1) + ' · ' + g.label,
      goal: done ? 'Nice scanning.' : g.goal,
      tokens: words.map((w, i) => {
        const f = inFound(i);
        const isWrong = s.wrong && s.wrong.i === i;
        let st = base;
        if (f) st += 'background: #C9E9D7; box-shadow: 0 0 0 3px #C9E9D7;' + (justFound(i) ? ' animation: ih-found .5s cubic-bezier(.34,1.3,.64,1);' : '');
        else if (isWrong) st += 'animation: ih-wrong .7s ease-out; color: #974E3D;';
        return {
          w, sp: i < words.length - 1 ? ' ' : '',
          style: st,
          tap: () => {
            if (this.state.task >= 3 || f) return;
            const r = ranges[this.state.task];
            if (i >= r[0] && i <= r[1]) {
              this.setState({ found: [...this.state.found, this.state.task], wrong: null, shake: 0 });
              clearTimeout(this.nt);
              this.nt = setTimeout(() => this.setState({ task: this.state.task + 1 }), 650);
            } else {
              this.n += 1;
              this.setState({ wrong: { i, n: this.n }, misses: this.state.misses + 1, shake: this.n });
            }
          },
        };
      }),
      hunting: !done, done,
      taskNo: Math.min(s.task + 1, 3),
      misses: s.misses,
      missStyle: s.misses ? 'color: #974E3D;' : '',
    };
  }
}
</script>
</body>
</html>
