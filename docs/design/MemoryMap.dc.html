<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memory Map</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#106350}a:hover{color:#0F5E4D}
button{font-family:inherit}
@keyframes mm-pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}70%{transform:translate(-50%,-50%) scale(1.08);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes mm-draw{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}
@keyframes mm-shake{0%,100%{margin-left:0}25%{margin-left:-6px}50%{margin-left:6px}75%{margin-left:-3px}}
@keyframes mm-glow{0%,100%{box-shadow:0 0 0 0 rgba(91,70,145,.0)}50%{box-shadow:0 0 0 10px rgba(91,70,145,.14)}}
@keyframes mm-chip{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes mm-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div ref="{{setRoot}}" onPointerMove="{{move}}" onPointerUp="{{up}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F7F5EE; color: #163B34; font-family: Manrope, system-ui, sans-serif; touch-action: none">
  <div style="position: absolute; left: 16px; right: 16px; top: 52px; display: flex; justify-content: space-between; align-items: center">
    <a href="Intro05Map.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 99px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 1px solid #DCE3DD"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#163B34" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <div style="text-align: center"><div style="font-size: 11px; font-weight: 800; letter-spacing: .14em; color: #5B4691">TRAINING · STEP 1 OF 3</div><div style="font-size: 17px; font-weight: 800">Memory Map</div></div>
    <span style="font-size: 13px; font-weight: 800; color: #55695F; min-width: 44px; text-align: right">{{count}}/4</span>
  </div>
  <div style="position: absolute; left: 22px; right: 22px; top: 112px; display: flex; gap: 6px; align-items: center">
    <span style="font-size: 12px; font-weight: 700; color: #55695F; margin-right: 4px">Preview level</span>
    <sc-for list="{{levels}}" as="l" hint-placeholder-count="3"><button type="button" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}" style="{{l.style}}">{{l.label}}</button></sc-for>
  </div>

  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0; pointer-events: none">
    <sc-for list="{{branches}}" as="b" hint-placeholder-count="4">
      <path d="{{b.d}}" fill="none" stroke="#C9BFE6" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round"></path>
    </sc-for>
    <sc-for list="{{drawn}}" as="b" hint-placeholder-count="0">
      <path d="{{b.d}}" fill="none" stroke="#8872CA" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="260" style="animation: mm-draw .55s cubic-bezier(.34,1.1,.64,1) both"></path>
    </sc-for>
  </svg>

  <div style="{{centerStyle}}"><span>The New<br>Library</span></div>

  <sc-for list="{{slots}}" as="s" hint-placeholder-count="4">
    <button type="button" aria-label="{{s.aria}}" onClick="{{s.tap}}" style="{{s.style}}">
      <sc-if value="{{s.filled}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; font-weight: 800">{{s.word}}</span></sc-if>
      <sc-if value="{{s.empty}}" hint-placeholder-val="{{ true }}"><span style="font-size: 13px; font-weight: 700; color: #6E5AA8">{{s.hint}}</span></sc-if>
    </button>
  </sc-for>

  <div style="position: absolute; left: 22px; right: 22px; top: 566px; font-size: 11px; font-weight: 800; letter-spacing: .12em; color: #55695F">{{bankLabel}}</div>
  <div style="position: absolute; left: 22px; right: 22px; top: 590px; display: flex; flex-wrap: wrap; gap: 8px">
    <sc-for list="{{bank}}" as="w" hint-placeholder-count="4">
      <button type="button" onPointerDown="{{w.down}}" style="{{w.style}}">{{w.text}}</button>
    </sc-for>
  </div>

  <sc-if value="{{dragging}}" hint-placeholder-val="{{ false }}">
    <div style="{{ghost}}">{{ghostText}}</div>
  </sc-if>

  <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 22px; right: 22px; bottom: 34px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: #55695F"><span>{{hint}}</span><span style="{{missStyle}}">{{misses}} wrong</span></div>
      <div style="min-height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 18px; background: #E6ECE4; color: #8A9A92; font-size: 16px; font-weight: 800">Fill all 4 branches</div>
    </div>
  </sc-if>
  <sc-if value="{{complete}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 22px; right: 22px; bottom: 34px; display: flex; flex-direction: column; gap: 10px; animation: mm-in .45s .3s both">
      <div style="border-radius: 18px; padding: 12px 14px; background: #EDE8FA; font-size: 14px; font-weight: 700; color: #5B4691">Map rebuilt from memory · {{misses}} wrong</div>
      <a href="Test.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 18px; background: #16846C; color: #FFFFFF; font-size: 17px; font-weight: 800; text-decoration: none; box-shadow: 0 10px 22px rgba(22,132,108,.28)">Continue to the test</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { level: 1, placed: {}, sel: null, drag: null, hover: null, wrong: null, misses: 0 };
    this.root = null;
    this.n = 0;
  }
  componentWillUnmount() { clearTimeout(this.wt); }
  model() {
    const slots = [
      { x: 92, y: 240, ans: '1998', hint: 'When did it open?' },
      { x: 298, y: 240, ans: 'Grain warehouse', hint: 'What was it before?' },
      { x: 92, y: 478, ans: 'Ewa Marek', hint: 'Who runs the club?' },
      { x: 298, y: 478, ans: 'Loans doubled', hint: 'What changed?' },
    ];
    const words = ['Loans doubled', '1998', 'Ewa Marek', 'Grain warehouse'];
    const extra = ['Bus line', 'Maria Kurz'];
    return { slots, words: this.state.level === 3 ? ['Loans doubled', 'Bus line', '1998', 'Ewa Marek', 'Maria Kurz', 'Grain warehouse'] : words, extra };
  }
  pt(e) {
    const r = this.root.getBoundingClientRect();
    const k = r.width / (this.root.offsetWidth || r.width) || 1;
    return { x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k };
  }
  nearest(p) {
    const { slots } = this.model();
    let best = null, bd = 82;
    slots.forEach((s, i) => {
      if (this.state.placed[i] !== undefined) return;
      const d = Math.hypot(s.x - p.x, s.y - p.y);
      if (d < bd) { bd = d; best = i; }
    });
    return best;
  }
  attempt(word, i) {
    const { slots } = this.model();
    if (word === null || i === null || this.state.placed[i] !== undefined) return;
    if (slots[i].ans === word) this.setState({ placed: { ...this.state.placed, [i]: word }, sel: null, drag: null, hover: null });
    else {
      this.n += 1;
      this.setState({ wrong: { i, n: this.n }, misses: this.state.misses + 1, sel: null, drag: null, hover: null });
      clearTimeout(this.wt);
      this.wt = setTimeout(() => this.setState({ wrong: null }), 600);
    }
  }
  renderVals() {
    const s = this.state;
    const { slots, words } = this.model();
    const cx = 195, cy = 360;
    const pathTo = (sl) => 'M ' + cx + ' ' + cy + ' C ' + (cx + (sl.x - cx) * 0.25) + ' ' + cy + ', ' + sl.x + ' ' + (cy + (sl.y - cy) * 0.55) + ', ' + sl.x + ' ' + sl.y;
    const usedWords = Object.values(s.placed);
    const count = usedWords.length;
    const complete = count === 4;
    const d = s.drag;
    let gx = 0, gy = 0;
    if (d) {
      gx = d.x; gy = d.y;
      if (s.hover !== null) { gx = d.x + (slots[s.hover].x - d.x) * 0.35; gy = d.y + (slots[s.hover].y - d.y) * 0.35; }
    }
    return {
      levels: [1, 2, 3].map((n) => ({
        label: 'L' + n, pressed: s.level === n ? 'true' : 'false',
        pick: () => this.setState({ level: n, placed: {}, sel: null, drag: null, hover: null, wrong: null, misses: 0 }),
        style: 'min-width: 44px; min-height: 32px; border-radius: 99px; font-size: 12px; font-weight: 800; cursor: pointer; ' + (s.level === n ? 'background: #163B34; color: #FFFFFF; border: 1px solid #163B34;' : 'background: #FFFFFF; color: #163B34; border: 1px solid #DCE3DD;'),
      })),
      setRoot: (el) => { this.root = el; },
      move: (e) => {
        if (!this.state.drag || !this.root) return;
        const p = this.pt(e);
        const moved = this.state.drag.moved || Math.hypot(p.x - this.state.drag.sx, p.y - this.state.drag.sy) > 6;
        this.setState({ drag: { ...this.state.drag, x: p.x, y: p.y, moved }, hover: moved ? this.nearest(p) : null });
      },
      up: () => {
        const dr = this.state.drag;
        if (!dr) return;
        if (!dr.moved) { this.setState({ drag: null, hover: null, sel: this.state.sel === dr.word ? null : dr.word }); return; }
        if (this.state.hover !== null) this.attempt(dr.word, this.state.hover);
        else this.setState({ drag: null, hover: null });
      },
      branches: slots.map((sl) => ({ d: pathTo(sl) })),
      drawn: Object.keys(s.placed).map((i) => ({ d: pathTo(slots[+i]) })),
      centerStyle: 'position: absolute; left: ' + cx + 'px; top: ' + cy + 'px; width: 112px; height: 112px; border-radius: 99px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 15px; line-height: 1.2; font-weight: 800; color: #FFFFFF; background: #5B4691; box-shadow: 0 12px 26px rgba(91,70,145,.3); transform: translate(-50%,-50%); animation: mm-pop .5s cubic-bezier(.34,1.56,.64,1) backwards' + (complete ? ', mm-glow 1.2s .2s ease-in-out 2;' : ';'),
      slots: slots.map((sl, i) => {
        const filled = s.placed[i] !== undefined;
        const hov = s.hover === i;
        const bad = s.wrong && s.wrong.i === i;
        const target = s.sel !== null && !filled;
        let st = 'position: absolute; left: ' + sl.x + 'px; top: ' + sl.y + 'px; width: 140px; min-height: 56px; box-sizing: border-box; padding: 8px 10px; border-radius: 18px; display: flex; align-items: center; justify-content: center; text-align: center; cursor: pointer; color: #163B34; transform: translate(-50%,-50%) scale(' + (hov ? '1.1' : '1') + '); transition: transform .25s cubic-bezier(.34,1.56,.64,1), background .2s, border-color .2s; animation: mm-pop .45s ' + (0.15 + i * 0.08).toFixed(2) + 's cubic-bezier(.34,1.56,.64,1) backwards; ';
        if (filled) st += 'background: #FFFFFF; border: 2px solid #8872CA; box-shadow: 0 6px 16px rgba(91,70,145,.16);';
        else if (bad) st += 'background: #FCECE6; border: 2px solid #B4533F; animation: mm-shake .4s;';
        else if (hov) st += 'background: #EDE8FA; border: 2px solid #8872CA;';
        else st += 'background: ' + (target ? '#F5F2FD' : 'rgba(255,255,255,.7)') + '; border: 2px dashed ' + (target ? '#8872CA' : '#C9BFE6') + ';';
        return {
          filled, empty: !filled, word: s.placed[i],
          hint: s.level === 1 ? sl.hint : '?',
          aria: filled ? 'Branch ' + (i + 1) + ': ' + s.placed[i] : 'Empty branch ' + (i + 1) + (s.level === 1 ? ', ' + sl.hint : ''),
          tap: () => { if (this.state.sel !== null) this.attempt(this.state.sel, i); },
          style: st,
        };
      }),
      bankLabel: complete ? 'ALL IDEAS PLACED' : 'WORD BANK · DRAG OR TAP',
      bank: words.filter((w) => usedWords.indexOf(w) < 0).map((w, k) => {
        const isDrag = d && d.word === w && d.moved;
        const isSel = s.sel === w;
        return {
          text: w,
          down: (e) => { if (!this.root) return; const p = this.pt(e); this.setState({ drag: { word: w, x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false } }); },
          style: 'min-height: 44px; padding: 0 16px; border-radius: 14px; font-size: 14px; font-weight: 800; cursor: grab; touch-action: none; user-select: none; transition: opacity .2s, background .2s, border-color .2s, transform .2s cubic-bezier(.34,1.56,.64,1); animation: mm-chip .35s ' + (0.4 + k * 0.05).toFixed(2) + 's both; ' +
            (isDrag ? 'opacity: .25; background: #FFFFFF; border: 2px dashed #C9BFE6; color: #163B34;' : isSel ? 'background: #5B4691; color: #FFFFFF; border: 2px solid #5B4691; transform: translateY(-2px);' : 'background: #FFFFFF; color: #163B34; border: 2px solid #DCE3DD; box-shadow: 0 1px 2px rgba(22,59,52,.06);'),
        };
      }),
      dragging: !!(d && d.moved),
      ghostText: d ? d.word : '',
      ghost: 'position: absolute; left: ' + gx + 'px; top: ' + gy + 'px; transform: translate(-50%,-50%) scale(1.06) rotate(-2deg); padding: 12px 16px; border-radius: 14px; background: #5B4691; color: #FFFFFF; font-size: 14px; font-weight: 800; white-space: nowrap; pointer-events: none; box-shadow: 0 16px 30px rgba(91,70,145,.35); transition: left .12s cubic-bezier(.34,1.56,.64,1), top .12s cubic-bezier(.34,1.56,.64,1);',
      playing: !complete, complete, count,
      misses: s.misses,
      missStyle: s.misses ? 'color: #974E3D;' : '',
      hint: s.sel !== null ? 'Tap a branch for "' + s.sel + '"' : 'Drag an idea onto its branch',
    };
  }
}
</script>
</body>
</html>
