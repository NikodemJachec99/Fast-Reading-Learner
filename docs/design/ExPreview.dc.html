<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exercise preview component</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{W}}px; height: {{H}}px; position: relative; overflow: hidden; border-radius: {{R}}px; filter: {{filter}}">
  <div role="img" aria-label="{{label}}" style="position: absolute; left: 0; top: 0; width: 120px; height: 84px; transform: scale({{s}}); transform-origin: 0 0; background: {{bg}}; overflow: hidden">

    <sc-if value="{{isRead}}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; left: 12px; right: 12px; top: 10px; display: flex; flex-direction: column; gap: 6px; animation: pv-scroll 6s linear infinite">
        <span style="height: 4px; width: 92%; border-radius: 3px; background: #9DB0A6"></span><span style="height: 4px; width: 80%; border-radius: 3px; background: #9DB0A6"></span><span style="height: 4px; width: 96%; border-radius: 3px; background: #9DB0A6"></span><span style="height: 4px; width: 60%; border-radius: 3px; background: #9DB0A6"></span>
        <span style="height: 4px; width: 0; margin-top: 2px"></span>
        <span style="height: 4px; width: 88%; border-radius: 3px; background: #9DB0A6"></span><span style="height: 4px; width: 94%; border-radius: 3px; background: #9DB0A6"></span><span style="height: 4px; width: 70%; border-radius: 3px; background: #9DB0A6"></span><span style="height: 4px; width: 90%; border-radius: 3px; background: #9DB0A6"></span><span style="height: 4px; width: 84%; border-radius: 3px; background: #9DB0A6"></span>
      </div>
      <div style="position: absolute; left: 0; right: 0; top: 0; height: 3px; background: #E6ECE4"><span style="display: block; height: 3px; background: #16846C; animation: pv-prog 6s linear infinite"></span></div>
      <div style="position: absolute; right: 8px; bottom: 7px; font-family: Manrope, sans-serif; font-size: 9px; font-weight: 800; color: #106350; background: #FFFFFF; border-radius: 99px; padding: 2px 6px">0:42</div>
    </sc-if>

    <sc-if value="{{isWave}}" hint-placeholder-val="{{ false }}">
      <span style="position: absolute; height: 12px; border-radius: 4px; background: #C9E9D7; animation: pv-wave 4.8s cubic-bezier(.65,0,.35,1) infinite"></span>
      <span style="position: absolute; left: 10px; top: 14px; width: 98px; height: 6px; border-radius: 3px; background: #7E948A"></span>
      <span style="position: absolute; left: 10px; top: 30px; width: 96px; height: 6px; border-radius: 3px; background: #7E948A"></span>
      <span style="position: absolute; left: 10px; top: 46px; width: 98px; height: 6px; border-radius: 3px; background: #B7C5BD"></span>
      <span style="position: absolute; left: 10px; top: 62px; width: 64px; height: 6px; border-radius: 3px; background: #B7C5BD"></span>
    </sc-if>

    <sc-if value="{{isBridges}}" hint-placeholder-val="{{ false }}">
      <svg aria-hidden="true" width="120" height="84" viewBox="0 0 120 84" style="position: absolute; left: 0; top: 0">
        <path d="M44 25 C60 25 58 59 76 59" fill="none" stroke="#16846C" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="80" style="animation: pv-draw 3.2s cubic-bezier(.34,1.3,.64,1) infinite"></path>
        <path d="M44 59 C60 59 58 25 76 25" fill="none" stroke="#E3C9BF" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4"></path>
      </svg>
      <span style="position: absolute; left: 8px; top: 16px; width: 36px; height: 18px; box-sizing: border-box; border-radius: 6px; border: 2px solid #E3C9BF; background: #FFFFFF; animation: pv-ok 3.2s infinite"></span>
      <span style="position: absolute; left: 76px; top: 50px; width: 36px; height: 18px; box-sizing: border-box; border-radius: 6px; border: 2px solid #E3C9BF; background: #FFFFFF; animation: pv-ok 3.2s infinite"></span>
      <span style="position: absolute; left: 8px; top: 50px; width: 36px; height: 18px; box-sizing: border-box; border-radius: 6px; border: 2px solid #E3C9BF; background: #FFFFFF"></span>
      <span style="position: absolute; left: 76px; top: 16px; width: 36px; height: 18px; box-sizing: border-box; border-radius: 6px; border: 2px solid #E3C9BF; background: #FFFFFF"></span>
    </sc-if>

    <sc-if value="{{isHunter}}" hint-placeholder-val="{{ false }}">
      <span style="position: absolute; left: 10px; top: 10px; width: 100px; height: 12px; border-radius: 4px; background: #163B34"></span>
      <span style="position: absolute; left: 14px; top: 14px; width: 56px; height: 4px; border-radius: 2px; background: #8ACFB2"></span>
      <span style="position: absolute; left: 10px; top: 32px; width: 98px; height: 5px; border-radius: 3px; background: #B7C5BD"></span>
      <span style="position: absolute; left: 10px; top: 44px; width: 40px; height: 5px; border-radius: 3px; background: #B7C5BD"></span>
      <span style="position: absolute; left: 76px; top: 44px; width: 32px; height: 5px; border-radius: 3px; background: #B7C5BD"></span>
      <span style="position: absolute; left: 52px; top: 42px; width: 22px; height: 9px; border-radius: 3px; animation: pv-found 4s infinite"></span>
      <span style="position: absolute; left: 10px; top: 56px; width: 92px; height: 5px; border-radius: 3px; background: #B7C5BD"></span>
      <span style="position: absolute; left: 10px; top: 68px; width: 70px; height: 5px; border-radius: 3px; background: #B7C5BD"></span>
      <span style="position: absolute; width: 22px; height: 22px; box-sizing: border-box; border-radius: 99px; border: 2px solid #106350; background: rgba(220,240,229,.45); animation: pv-scan 4s cubic-bezier(.65,0,.35,1) infinite"></span>
    </sc-if>

    <sc-if value="{{isMap}}" hint-placeholder-val="{{ false }}">
      <svg aria-hidden="true" width="120" height="84" viewBox="0 0 120 84" style="position: absolute; left: 0; top: 0">
        <path d="M60 42 C44 42 36 20 20 18" fill="none" stroke="#8872CA" stroke-width="2" stroke-linecap="round" stroke-dasharray="80" style="animation: pv-draw 4s infinite"></path>
        <path d="M60 42 C76 42 84 20 100 18" fill="none" stroke="#8872CA" stroke-width="2" stroke-linecap="round" stroke-dasharray="80" style="animation: pv-draw 4s .25s infinite"></path>
        <path d="M60 42 C44 42 36 64 20 66" fill="none" stroke="#8872CA" stroke-width="2" stroke-linecap="round" stroke-dasharray="80" style="animation: pv-draw 4s .5s infinite"></path>
        <path d="M60 42 C76 42 84 64 100 66" fill="none" stroke="#8872CA" stroke-width="2" stroke-linecap="round" stroke-dasharray="80" style="animation: pv-draw 4s .75s infinite"></path>
        <circle cx="20" cy="18" r="7" fill="#FFFFFF" stroke="#8872CA" stroke-width="2" style="transform-box: fill-box; transform-origin: center; animation: pv-pop 4s .3s infinite"></circle>
        <circle cx="100" cy="18" r="7" fill="#FFFFFF" stroke="#8872CA" stroke-width="2" style="transform-box: fill-box; transform-origin: center; animation: pv-pop 4s .55s infinite"></circle>
        <circle cx="20" cy="66" r="7" fill="#FFFFFF" stroke="#8872CA" stroke-width="2" style="transform-box: fill-box; transform-origin: center; animation: pv-pop 4s .8s infinite"></circle>
        <circle cx="100" cy="66" r="7" fill="#FFFFFF" stroke="#8872CA" stroke-width="2" style="transform-box: fill-box; transform-origin: center; animation: pv-pop 4s 1.05s infinite"></circle>
        <circle cx="60" cy="42" r="11" fill="#5B4691" style="transform-box: fill-box; transform-origin: center; animation: pv-pulse 2s ease-in-out infinite"></circle>
      </svg>
    </sc-if>

    <sc-if value="{{isFading}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; left: 10px; top: 14px; display: flex; gap: 3px">
        <span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s 0s infinite"></span><span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s .1s infinite"></span><span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s .2s infinite"></span><span style="width: 3px"></span><span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s .3s infinite"></span><span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s .4s infinite"></span><span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s .5s infinite"></span><span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s .6s infinite"></span><span style="width: 3px"></span><span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s .7s infinite"></span><span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s .8s infinite"></span>
      </div>
      <div style="position: absolute; left: 10px; top: 34px; display: flex; gap: 3px">
        <span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s .9s infinite"></span><span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s 1s infinite"></span><span style="width: 3px"></span><span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s 1.1s infinite"></span><span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s 1.2s infinite"></span><span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s 1.3s infinite"></span><span style="width: 3px"></span><span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s 1.4s infinite"></span><span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s 1.5s infinite"></span><span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s 1.6s infinite"></span><span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s 1.7s infinite"></span>
      </div>
      <div style="position: absolute; left: 10px; top: 54px; display: flex; gap: 3px">
        <span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s 1.8s infinite"></span><span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s 1.9s infinite"></span><span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s 2s infinite"></span><span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s 2.1s infinite"></span><span style="width: 3px"></span><span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s 2.2s infinite"></span><span style="width: 7px; height: 8px; border-radius: 2px; background: #163B34; animation: pv-fadeL 3.6s 2.3s infinite"></span>
      </div>
    </sc-if>

    <sc-if value="{{isShorten}}" hint-placeholder-val="{{ false }}">
      <span style="position: absolute; left: 10px; top: 9px; width: 100px; height: 5px; border-radius: 3px; background: #C9B4AC"></span>
      <span style="position: absolute; left: 10px; top: 18px; width: 76px; height: 5px; border-radius: 3px; background: #974E3D; animation: pv-fly1 4s cubic-bezier(.34,1.3,.64,1) infinite"></span>
      <span style="position: absolute; left: 10px; top: 27px; width: 92px; height: 5px; border-radius: 3px; background: #C9B4AC"></span>
      <span style="position: absolute; left: 10px; top: 36px; width: 60px; height: 5px; border-radius: 3px; background: #974E3D; animation: pv-fly2 4s .4s cubic-bezier(.34,1.3,.64,1) infinite"></span>
      <span style="position: absolute; left: 6px; right: 6px; top: 50px; height: 28px; box-sizing: border-box; border-radius: 7px; border: 1.5px dashed #974E3D; background: rgba(255,255,255,.7)"></span>
    </sc-if>

    <sc-if value="{{isAssoc}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; left: 12px; top: 12px; width: 44px; height: 60px; perspective: 300px">
        <div style="position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: pv-flip 4.4s cubic-bezier(.65,0,.35,1) infinite">
          <div style="position: absolute; inset: 0; backface-visibility: hidden; border-radius: 8px; background: #2D2350; overflow: hidden">
            <span style="position: absolute; left: 13px; top: 12px; width: 18px; height: 18px; border-radius: 99px; background: #EDBD60"></span>
            <span style="position: absolute; left: -6px; bottom: -14px; width: 56px; height: 36px; border-radius: 50%; background: #5B4691"></span>
          </div>
          <div style="position: absolute; inset: 0; backface-visibility: hidden; transform: rotateY(180deg); border-radius: 8px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><span style="width: 26px; height: 5px; border-radius: 3px; background: #5B4691"></span></div>
        </div>
      </div>
      <div style="position: absolute; left: 64px; top: 12px; width: 44px; height: 60px; perspective: 300px">
        <div style="position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: pv-flip 4.4s .5s cubic-bezier(.65,0,.35,1) infinite">
          <div style="position: absolute; inset: 0; backface-visibility: hidden; border-radius: 8px; background: #163B34; overflow: hidden">
            <span style="position: absolute; left: 19px; top: 10px; width: 6px; height: 34px; border-radius: 3px; background: #DCF0E5"></span>
            <span style="position: absolute; left: 14px; top: 8px; width: 16px; height: 7px; border-radius: 3px; background: #EDBD60"></span>
          </div>
          <div style="position: absolute; inset: 0; backface-visibility: hidden; transform: rotateY(180deg); border-radius: 8px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><span style="width: 22px; height: 5px; border-radius: 3px; background: #5B4691"></span></div>
        </div>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{locked}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(247,245,238,.45)">
      <span style="width: 28px; height: 28px; border-radius: 99px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(22,59,52,.18)"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#163B34" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="3"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ex":{"editor":"enum","options":["read","wave","bridges","hunter","map","fading","shorten","assoc"],"default":"wave"},"scale":{"editor":"float","min":0.5,"max":4,"step":0.1,"default":1},"locked":{"editor":"boolean","default":false},"$preview":{"width":120,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const ex = this.props.ex ?? 'wave';
    const s = Number(this.props.scale ?? 1);
    const locked = !!this.props.locked;
    const bgs = { read: '#FBFAF6', wave: '#FBFAF6', bridges: '#FCECE6', hunter: '#EEF8F3', map: '#EDE8FA', fading: '#FBFAF6', shorten: '#FCECE6', assoc: '#EDE8FA' };
    const labels = {
      read: 'Preview: text scrolls while a progress bar fills',
      wave: 'Preview: a green highlight glides from phrase to phrase',
      bridges: 'Preview: a curved line connects two concepts and turns green',
      hunter: 'Preview: a lens scans the text and finds the target word',
      map: 'Preview: branches grow from a central idea',
      fading: 'Preview: letters fade in a wave while the layout stays still',
      shorten: 'Preview: key sentences move into a summary box',
      assoc: 'Preview: picture cards flip to reveal their words',
    };
    return {
      W: Math.round(120 * s), H: Math.round(84 * s), R: Math.round(12 * Math.min(s, 1.6)), s,
      bg: bgs[ex], label: labels[ex],
      filter: locked ? 'grayscale(.7)' : 'none',
      locked,
      isRead: ex === 'read', isWave: ex === 'wave', isBridges: ex === 'bridges', isHunter: ex === 'hunter',
      isMap: ex === 'map', isFading: ex === 'fading', isShorten: ex === 'shorten', isAssoc: ex === 'assoc',
    };
  }
}
</script>
</body>
</html>
