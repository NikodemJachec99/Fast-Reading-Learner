<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes ix-grow{from{opacity:0;transform:scale(.36)}to{opacity:1;transform:none}}
@keyframes ix-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ix-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

@keyframes fr-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes pv-scan{0%{left:2px;top:22px}25%{left:84px;top:22px}50%{left:4px;top:50px}75%,100%{left:52px;top:35px}}
@keyframes pv-found{0%,72%{background:transparent;transform:scale(1)}82%{background:#16846C;transform:scale(1.25)}92%,100%{background:#16846C;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>

  <dc-import name="ExIntro" ex="hunter" hint-size="390px,844px"></dc-import>
