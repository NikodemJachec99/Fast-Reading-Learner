<style>
body{margin:0}
a{color:#106350}a:hover{color:#0F5E4D}
@keyframes fr-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fr-pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes fr-bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(-2deg)}}
@keyframes fr-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes fr-spark{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@keyframes fr-shine{0%{transform:translateX(-140%) skewX(-18deg)}55%,100%{transform:translateX(420%) skewX(-18deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F7F5EE; color: #163B34; font-family: Manrope, system-ui, sans-serif">

      <span style="width: 22px; height: 6px; border-radius: 99px; background: #16846C"></span><span style="width: 6px; height: 6px; border-radius: 99px; background: #C9D3CB"></span><span style="width: 6px; height: 6px; border-radius: 99px; background: #C9D3CB"></span>

  </div>

  <div style="position: absolute; left: 0; right: 0; top: 140px; display: flex; justify-content: center">

      <dc-import name="PikoMark" mood="happy" size="150" hint-size="150px,164px"></dc-import>
    </div>
  </div>

  <div style="position: absolute; left: 22px; right: 22px; top: 392px; display: flex; flex-direction: column; gap: 12px; animation: fr-rise .6s .15s cubic-bezier(.2,.8,.2,1) both">
    <h1 style="margin: 0; font-size: 32px; line-height: 1.08; font-weight: 800; letter-spacing: -.035em">Hi, I'm Piko.<br>Let's read better.</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.55; color: #4F655B">Eight minutes a day. You train one skill, read a short new text and check what you understood.</p>
    <div style="display: flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 800; margin-top: 4px">
      <span style="padding: 7px 11px; border-radius: 10px; background: #DCF0E5; color: #106350">Exercise</span><span aria-hidden="true" style="color: #55695F">→</span>
      <span style="padding: 7px 11px; border-radius: 10px; background: #EDE8FA; color: #5B4691">Text</span><span aria-hidden="true" style="color: #55695F">→</span>
      <span style="padding: 7px 11px; border-radius: 10px; background: #FCECE6; color: #974E3D">Test</span>
    </div>
  </div>

  <div style="position: absolute; left: 22px; right: 22px; top: 620px; display: flex; flex-direction: column; gap: 8px; animation: fr-rise .6s .25s cubic-bezier(.2,.8,.2,1) both">

    <input id="name" type="text" placeholder="Your first name" style="min-height: 52px; box-sizing: border-box; border-radius: 16px; border: 1px solid #C9D3CB; background: #FFFFFF; padding: 0 16px; font-family: Manrope, sans-serif; font-size: 16px; font-weight: 600; color: #163B34">
