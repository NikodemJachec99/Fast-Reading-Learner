<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { wpm: 0 };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      if (this.state.wpm >= 236) { clearInterval(this.timer); return; }
      this.setState({ wpm: Math.min(236, this.state.wpm + 9) });
    }, 22);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    return { wpm: this.state.wpm };
  }
}
</script>
