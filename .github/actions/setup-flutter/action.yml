name: Set up Flutter
description: Installs the Flutter version pinned in .fvmrc and fetches dependencies.

runs:
  using: composite
  steps:
    - name: Read Flutter version from .fvmrc
      id: version
      shell: bash
      run: echo "flutter=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ steps.version.outputs.flutter }}
        channel: stable
        cache: true

    - name: Install dependencies
      shell: bash
      run: flutter pub get
