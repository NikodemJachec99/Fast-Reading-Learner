name: Release

# Creates a GitHub Release with an Android APK and a zipped web build.
# Start it in one of two ways:
#   - GitHub: Actions → Release → Run workflow, enter a version (e.g. v0.1.0).
#     The tag is created on the latest commit of main.
#   - Git: git tag v0.1.0 && git push origin v0.1.0
# Versions containing a hyphen (v0.2.0-beta.1) are published as pre-releases.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0 (a new tag is created on main)"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.version || github.ref_name }}

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Validate version
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a valid version. Use the format v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Releases can only be created from main."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG already exists. Choose a new version."
              exit 1
            fi
          fi

      - uses: ./.github/actions/setup-flutter

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test

  build-android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: ./.github/actions/setup-flutter

      - name: Build release APK
        run: |
          version="${TAG#v}"
          flutter build apk --release \
            --build-name="$version" \
            --build-number="${{ github.run_number }}"
          mv build/app/outputs/flutter-apk/app-release.apk \
            "fast-reading-learner-$version.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: fast-reading-learner-*.apk
          if-no-files-found: error

  build-web:
    name: Build web
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter

      - name: Build web app
        run: |
          version="${TAG#v}"
          flutter build web --release \
            --build-name="$version" \
            --build-number="${{ github.run_number }}"
          (cd build/web && zip -qr "$GITHUB_WORKSPACE/fast-reading-learner-web-$version.zip" .)

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: fast-reading-learner-web-*.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build-android, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then
            prerelease="--prerelease"
          fi
          # --target is only used when the tag does not exist yet (Run workflow).
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            $prerelease
